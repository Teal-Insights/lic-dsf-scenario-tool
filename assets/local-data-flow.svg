<svg xmlns="http://www.w3.org/2000/svg" width="880" height="820" viewBox="0 0 880 820" role="img" aria-labelledby="title desc">
<title id="title">Analytical work stays in the local workflow until the user shares an export</title>
<desc id="desc">Within a trusted single-user computer, the browser connects to a loopback application. The app preserves a separate workbook copy, saved scenarios and private notes, starts a bounded calculation worker and creates local exports. Outside this workflow, the analyst deliberately reviews and sends selected exports.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#143E5A"/></marker></defs>
<rect width="880" height="820" fill="#FAFAF7"/>
<rect x="20" y="65" width="840" height="570" rx="18" fill="#F2F8FA" stroke="#143E5A" stroke-width="2"/>
<g font-family="Inter, Arial, sans-serif" fill="#143E5A">
<text x="40" y="40" font-size="27" font-weight="700">Your computer: a trusted single-user workspace</text>
<rect x="65" y="110" width="300" height="110" rx="12" fill="white" stroke="#D4D0CA"/>
<text x="90" y="152" font-size="25" font-weight="700">Browser interface</text><text x="90" y="189" font-size="21" fill="#5C6770">Local address, local controls</text>
<rect x="510" y="110" width="300" height="110" rx="12" fill="white" stroke="#D4D0CA"/>
<text x="535" y="152" font-size="25" font-weight="700">Local application</text><text x="535" y="189" font-size="21" fill="#5C6770">Bundled Python runtime</text>
<path d="M 375 165 H 500" stroke="#143E5A" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="390" y="145" font-size="18">loopback</text>
<rect x="65" y="300" width="345" height="150" rx="12" fill="white" stroke="#D4D0CA"/>
<text x="90" y="338" font-size="25" font-weight="700">Saved analytical work</text><text x="90" y="373" font-size="21" fill="#5C6770">Workbook copy and scenarios</text><text x="90" y="406" font-size="21" fill="#5C6770">Private notes and job records</text>
<rect x="480" y="300" width="330" height="150" rx="12" fill="white" stroke="#D4D0CA"/>
<text x="505" y="338" font-size="25" font-weight="700">Calculation worker</text><text x="505" y="373" font-size="21" fill="#5C6770">Bounded time and lifetime</text><text x="505" y="406" font-size="21" fill="#5C6770">No Excel or AI service needed</text>
<path d="M 600 230 V 258 H 240 V 290" fill="none" stroke="#143E5A" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 700 230 V 290" fill="none" stroke="#143E5A" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="155" y="520" width="570" height="80" rx="12" fill="white" stroke="#0094BC" stroke-width="2"/>
<text x="180" y="551" font-size="24" font-weight="700">Local briefing exports</text><text x="180" y="581" font-size="20" fill="#5C6770">Charts, tables and deliberately shared explanations</text>
<text x="370" y="492" font-size="18" fill="#5C6770">Results used by the app</text>
<path d="M 645 460 V 510" fill="none" stroke="#143E5A" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 440 610 V 685" fill="none" stroke="#0094BC" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="475" y="666" font-size="20" fill="#5C6770">Your choice to share</text>
<rect x="155" y="695" width="570" height="100" rx="12" fill="white" stroke="#D4D0CA"/>
<text x="180" y="733" font-size="25" font-weight="700">Review, then send selected files</text><text x="180" y="769" font-size="21" fill="#5C6770">Private notes and source workbook stay excluded.</text>
</g></svg>
