[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lic-dsf-scenario-tool"
version = "0.1.0a3"
description = "Local customized scenario analysis for LIC-DSF IDA21 workbooks"
requires-python = ">=3.13"
license = {file = "LICENSE"}
dependencies = [
  "lic-dsf-2025-08-12 @ git+https://github.com/Teal-Insights/lic-dsf-2025-08-12@121015367f8ca6a6d9dab5fc94bfe9596605fd00",
  "openpyxl==3.1.5",
  "numpy==2.4.6",
  "PyYAML==6.0.3",
  "matplotlib==3.11.1",
  "fastpyxl==1.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
lic-dsf-scenario-tool = "lic_dsf.app:main"

[tool.setuptools.package-data]
lic_dsf = ["web.html", "hosted_wait.js", "illustrative_cases/*.json", "fonts/*.otf", "fonts/*.txt", "fonts/README.md"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# The first preview gates implementation errors. A broad formatting rewrite is
# deliberately separate from numerical and packaging acceptance.
select = ["E9", "F63", "F7", "F82", "F841"]
